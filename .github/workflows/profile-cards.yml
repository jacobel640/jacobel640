name: Profile Cards

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render_profile.py"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check fonttools==4.68.0 materialyoucolor==3.0.4

      # Optional SUMMARY_GITHUB_TOKEN (fine-grained PAT, read-only Contents + Metadata on the
      # flagship repositories) refreshes private repository metrics and the full PR count.
      # Without it, private cards are re-rendered from assets/live/repos.json.
      - name: Render README and cards from live GitHub data
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.SUMMARY_GITHUB_TOKEN != '' }}
        run: python -I .github/scripts/render_profile.py

      - name: Commit as profile owner
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git -c user.name="jacobel640" -c user.email="jacobel640@gmail.com" \
            commit -m "Refresh profile cards"
          git push
