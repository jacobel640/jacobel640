<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Jacob Elcharar — Native Android Engineer, Fullstack GenAI Builder"><style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}

.b1{animation:d1 14s ease-in-out infinite alternate}
.b2{animation:d2 17s ease-in-out infinite alternate}
.b3{animation:d3 20s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,40px)}}
@keyframes d2{to{transform:translate(-140px,-30px)}}
@keyframes d3{to{transform:translate(90px,-50px)}}
.shine{animation:shine 6s linear infinite}
@keyframes shine{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E0F2FE"/><stop offset=".45" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".2" stop-color="#38BDF8"/>
    <stop offset=".5" stop-color="#818CF8"/><stop offset=".8" stop-color="#10B981"/>
    <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity=".07"/>
  </pattern>
  <radialGradient id="fadeMask" cx=".5" cy=".45" r=".65">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask"><rect width="1200" height="360" fill="url(#fadeMask)"/></mask>
  <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="360" fill="#0D1117"/>
  <g filter="url(#blur)" opacity=".55">
    <circle class="b1" cx="250" cy="90" r="190" fill="#38BDF8" opacity=".55"/>
    <circle class="b2" cx="900" cy="110" r="210" fill="#818CF8" opacity=".6"/>
    <circle class="b3" cx="620" cy="360" r="170" fill="#10B981" opacity=".35"/>
  </g>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
  <text x="44" y="52" class="mono" font-size="15" fill="#64748B"><tspan fill="#10B981">jacobel640@github</tspan>:<tspan fill="#38BDF8">~</tspan>$ whoami<tspan class="cursor" fill="#38BDF8"> ▍</tspan></text>
  <text x="1156" y="52" text-anchor="end" class="mono" font-size="13" fill="#64748B">jacobelcharar.dev</text>
  <text x="600" y="186" text-anchor="middle" class="sans" font-size="84" font-weight="800" letter-spacing="-1.5" fill="#38BDF8" opacity=".45" filter="url(#glow)">Jacob Elcharar</text>
  <text x="600" y="186" text-anchor="middle" class="sans" font-size="84" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Jacob Elcharar</text>
  <text x="600" y="236" text-anchor="middle" class="mono" font-size="21" fill="#94A3B8" letter-spacing="1">Native Android Engineer  <tspan fill="#818CF8">·</tspan>  Fullstack GenAI Builder</text>
  <g class="mono" font-size="14" fill="#64748B">
    <circle class="pulse" cx="438" cy="286" r="4.5" fill="#10B981"/>
    <text x="452" y="291">4 yrs shipping production systems <tspan fill="#818CF8">·</tspan> open to senior roles</text>
  </g>
  <rect x="0" y="357" width="1200" height="3" fill="url(#rule)"/>
  <rect class="shine" x="0" y="357" width="260" height="3" fill="url(#sheen)" opacity=".7"/>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#1E293B"/>
</svg>
