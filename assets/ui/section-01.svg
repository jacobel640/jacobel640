<svg xmlns="http://www.w3.org/2000/svg" width="880" height="46" viewBox="0 0 880 46" role="img" aria-label="Tech Stack"><style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#818CF8" stop-opacity=".6"/>
  <stop offset="1" stop-color="#818CF8" stop-opacity="0"/></linearGradient></defs>
<text x="0" y="29" class="mono" font-size="15" font-weight="700" letter-spacing="2">
  <tspan fill="#38BDF8">// 01</tspan><tspan fill="#F8FAFC" dx="10">TECH STACK</tspan></text>
<rect x="168" y="23" width="712" height="1.5" fill="url(#r)"/>
</svg>
